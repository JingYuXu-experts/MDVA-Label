---
"on":
  push:
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

env:
  python-version: "3.10"
  cache: pip

jobs:
  test:
    # 本项目引擎与 Web 面的测试集 tests/mdva（历史里的上游测试目录已按发起人
    # 2026-11-06 指令移除，本文件 git 历史可查原貌）。
    # science.txt 必装：tests 里对 astropy 用 importorskip，不装等于整块静默跳过。
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-version }}
          cache: ${{ env.cache }}
          cache-dependency-path: |-
            requirements.txt
            requirements/science.txt
            requirements/dev.txt
      - name: Install dependencies
        run: |
          pip install -e ".[science,dev]"
      - name: Test
        run: |
          pytest tests/mdva -q
  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-version }}
          cache: ${{ env.cache }}
          cache-dependency-path: |-
            requirements.txt
            requirements/dev.txt
      - name: Install dependencies
        run: |
          pip install build
      - name: Build
        run: |
          python -m build
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux' && ! startsWith(github.ref, 'refs/tags/')
        with:
          path: |
            dist/*
  # 发布类作业（PyPI 上传 / Release 附件 / AUR 包自动更新）整体停用待决：
  # 它们是上游的分发渠道，AUR 包名与 changelog 路径都指向上游资产；本项目若要
  # 走正式发布，由发起人决定渠道后重建（原内容见本文件 git 历史）。
